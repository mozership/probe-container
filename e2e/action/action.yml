# probe-container built from this checkout, for the workflows of e2e. Probe
# resolves an action before the first job starts, so the executable is built
# before probe runs:
#
#   go build -o e2e/action/probe-container . && probe e2e/workflow.yml
name: container
description: Start a container, and remove it once the run is over
params:
  - image
  - name
  - command
  - env
  - ports
  - volumes
  - network
  - pull
  - wait
  - keep
  - labels
  - platform
  - entrypoint
  - user
  - workdir
  - hostname
  - network_aliases
  - add_hosts
  - dns
  - env_files
  - tmpfs
  - cap_add
  - cap_drop
  - ulimits
  - memory
  - cpus
  - shm_size
  - privileged
  - read_only
  - init
cleanup: true
runs:
  using: binary
  path: probe-container
